apply plugin: 'com.android.application'

// ── Release signing ────────────────────────────────────────────────────────
// The keystore and its passwords are deliberately NOT in this repo (they used
// to be hardcoded here, which meant anyone with read access could sign an
// update that Play would accept). Provide them either as
// client/android/keystore.properties (gitignored) or as environment variables:
//
//   SKILLSWAP_STORE_FILE, SKILLSWAP_STORE_PASSWORD,
//   SKILLSWAP_KEY_ALIAS,  SKILLSWAP_KEY_PASSWORD
//
// Without them the release build still runs but produces UNSIGNED artifacts.
def skillswapKsProps = new Properties()
def skillswapKsFile = rootProject.file('keystore.properties')
if (skillswapKsFile.exists()) {
    skillswapKsFile.withInputStream { skillswapKsProps.load(it) }
}
def skillswapStoreFile = skillswapKsProps.getProperty('storeFile') ?: System.getenv('SKILLSWAP_STORE_FILE')
def skillswapStorePassword = skillswapKsProps.getProperty('storePassword') ?: System.getenv('SKILLSWAP_STORE_PASSWORD')
def skillswapKeyAlias = skillswapKsProps.getProperty('keyAlias') ?: System.getenv('SKILLSWAP_KEY_ALIAS')
def skillswapKeyPassword = skillswapKsProps.getProperty('keyPassword') ?: System.getenv('SKILLSWAP_KEY_PASSWORD')
if (skillswapStoreFile != null && !file(skillswapStoreFile).exists()) {
    logger.warn("SkillSwap: keystore '${skillswapStoreFile}' not found — release artifacts will be UNSIGNED.")
    skillswapStoreFile = null
}

// FCM needs app/google-services.json (from your Firebase project). Until that
// file exists we drop the FCM-only sources + dependency so the APK still builds;
// once you paste the file in, drop the stack in comment below to re-enable push.
def fcmEnabled = file('google-services.json').exists()

android {
    namespace "app.skillswap.client"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.skillswap.client"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (!fcmEnabled) {
        sourceSets {
            main {
                java.exclude '**/CallFirebaseMessagingService.java'
                java.exclude '**/PushPlugin.java'
            }
        }
    }
    signingConfigs {
        release {
            if (skillswapStoreFile != null) {
                storeFile file(skillswapStoreFile)
                storePassword skillswapStorePassword
                keyAlias skillswapKeyAlias
                keyPassword skillswapKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Unsigned when no keystore is available (e.g. CI without secrets).
            if (skillswapStoreFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Google Play Billing
    implementation 'com.android.billingclient:billing:7.0.0'

    // Firebase Cloud Messaging (only when google-services.json is present)
    if (fcmEnabled) {
        implementation 'com.google.firebase:firebase-messaging:23.4.1'
    }

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
