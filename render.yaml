# SkillSwap — one-click Render Blueprint
#
# After Render deploys this Blueprint, follow the steps in docs/DEPLOY.md.

databases:
  - name: skillswap-db
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: skillswap-api
    plan: free
    region: oregon
    runtime: node
    rootDir: server
    # Schema changes go through versioned migrations (`prisma migrate deploy`).
    # `ensure-migrations.js` baselines a database that was originally created with
    # `db push`, so the first deploy after this change is a no-op instead of a
    # destructive re-sync. `db push --accept-data-loss` must never run in prod.
    buildCommand: cd .. && npm ci --include=dev && npm run --prefix client build && cd server && npx prisma generate && node scripts/ensure-migrations.js && npx prisma migrate deploy && npm run build:prod && node scripts/seed-prod.js
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: skillswap-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 365d
      - key: ADMIN_EMAIL
        value: jimoh0004@gmail.com
      - key: COOKIE_SECRET
        generateValue: true
      # '*' means "not configured": the API then allows only its own origin plus
      # the Capacitor WebView origins (https://localhost, capacitor://localhost).
      # It never reflects an arbitrary Origin, because credentials are enabled.
      # List real domains comma-separated if the client is ever hosted separately.
      - key: CLIENT_URL
        value: '*'
      # This service's own public origin. CLIENT_URL above is '*' because it also
      # feeds the CORS allow-list, and a wildcard there is safe — but it cannot be
      # used to build links. SERVER_URL is the fallback base for password-reset
      # links and must be a real URL, not the localhost default.
      - key: SERVER_URL
        value: 'https://skillswap-api-dcg8.onrender.com'
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 500
      - key: LOG_LEVEL
        value: info
      # Must be 'true' to accept real Google Play purchases. While it is 'false'
      # the server REJECTS every Android purchase rather than trusting the token —
      # otherwise any client could mint PRO by posting a fake purchaseToken.
      # To go live: set this to 'true' and paste the Firebase/Play service-account
      # JSON into GOOGLE_PLAY_SERVICE_ACCOUNT_JSON below.
      - key: PLAY_BILLING_VERIFY
        value: 'false'
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        value: ''
      # Grants PRO from POST /api/subscription/web with NO payment provider.
      # Keep 'false' in production: 'true' makes Pro free for anyone with a cookie.
      - key: ENABLE_WEB_BILLING
        value: 'false'
      - key: ANDROID_PACKAGE_NAME
        value: app.skillswap.client
      - key: RESET_URL
        value: 'https://skillswap-api-dcg8.onrender.com/reset-password'
      - key: VITE_API_URL
        value: https://skillswap-api-dcg8.onrender.com
      # ── WebRTC relay (TURN) ──────────────────────────────────────────────
      # Without a relay, two peers behind carrier-grade NAT (the normal case on
      # mobile data in Nigeria) ring, connect, and hear nothing. These are
      # server-side on purpose: GET /api/calls/ice-servers mints a short-lived
      # coturn REST credential per request, so the secret never ships in the web
      # bundle or the APK and can be rotated without rebuilding either.
      # Free coturn on an Oracle Always Free VPS: docs/TURN.md.
      # Hosted relay with no VPS at all (Metered free tier): docs/RELAY-HOSTED.md.
      # Comma-separated turn:/turns: URLs — include one of each, because
      # restrictive networks block UDP and 3478.
      - key: TURN_URLS
        value: ''
      # = coturn's static-auth-secret. Generate with `openssl rand -hex 32`.
      - key: TURN_SECRET
        value: ''
      # = coturn's realm. Must match: the realm is half of the minted username.
      - key: TURN_REALM
        value: 'turn.skillswap.app'
      # Credential lifetime; must outlive a whole call, since coturn re-checks it
      # on every allocation refresh.
      - key: TURN_TTL_SECONDS
        value: '3600'
      # Static credentials for providers without HMAC support. Metered's free
      # tier is the no-VPS / no-card / no-domain option: docs/RELAY-HOSTED.md.
      # Read only when TURN_SECRET is empty — if TURN_SECRET holds anything the
      # server mints coturn-style HMAC credentials instead and a hosted static
      # endpoint will reject every allocation.
      # sync:false so a Blueprint sync never overwrites the real values set in
      # the dashboard with these placeholders.
      - key: TURN_USERNAME
        value: ''
        sync: false
      - key: TURN_CREDENTIAL
        value: ''
        sync: false
      # Escape hatch for providers that only issue static credentials (Xirsys,
      # Metered). Used only when TURN_SECRET is empty, and unlike the minted ones
      # these reach the client — so prefer TURN_SECRET. Every VITE_* value is
      # inlined into the bundle at BUILD time by this service, which is why they
      # live here rather than on a separate frontend.
      - key: VITE_TURN_URLS
        value: ''
      - key: VITE_TURN_USERNAME
        value: ''
      - key: VITE_TURN_CREDENTIAL
        value: ''
      # ── Group calls ─────────────────────────────────────────────────────
      # Mesh cap: n participants means n*(n-1) streams, and each phone uploads
      # n-1 copies of itself, so the uplink fails before the relay does.
      # Enforced by the socket layer and published to the picker by
      # GET /api/calls/limits. Groups also start audio-only, with video opt-in
      # per participant. Raise this only alongside a move to an SFU.
      - key: MAX_GROUP_CALL_PARTICIPANTS
        value: '4'
      # Server-side Firebase service account: Firebase console → Project settings
      # → Service accounts → Generate new private key. Paste the whole JSON on
      # ONE line (no trailing newline). This is the secret that lets the API SEND
      # pushes; it is NOT the Android google-services.json, which is the public
      # per-app config the mobile build needs to RECEIVE them. Both are required
      # for push to work end to end. Without this, fcm.service.ts returns null
      # and notifications are silently skipped.
      - key: FCM_SERVICE_ACCOUNT_JSON
        value: ''
      # ── Email (password reset only) — docs/EMAIL.md ───────────────────────
      # Empty means password reset silently fails: auth.service.ts swallows the
      # send error so the endpoint cannot reveal which addresses exist.
      # Pre-filled for Brevo's free relay (300 emails/day, no card, no domain).
      # Four of the five are not secret, so only SMTP_PASS has to be typed into
      # the dashboard. Gmail SMTP instead (smtp.gmail.com + a 16-char App
      # Password, 500/day) has better inbox placement — docs/EMAIL.md explains
      # the trade-off, and switching means editing these four values.
      # RESEND_API_KEY below is useless until a domain is verified: unverified
      # Resend delivers only to the account owner's own address, so it passes a
      # self-test and rejects every real user. Delete it if it is set.
      - key: SMTP_HOST
        value: 'smtp-relay.brevo.com'
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        # Brevo's SMTP login is NOT the account email. It is the generated
        # address shown as "Login" on Settings -> SMTP & API -> SMTP, in the
        # form xxxxxxx@smtp-brevo.com. Using the account email instead makes
        # the relay answer "535 5.7.8 Authentication failed" no matter how
        # correct the key is. Find yours in the dashboard and put it here.
        value: bb648e001@smtp-brevo.com
      - key: SMTP_PASS
        sync: false
        # Brevo → SMTP & API → SMTP → "Generate a new SMTP key". Shown once.
        # Secret: set it in the Render dashboard, never commit it here.
        # If the relay answers "525 5.7.1 Unauthorized IP address" the
        # credentials are fine but the account blocks unknown IPs: turn that
        # off at Settings -> Security -> Authorized IPs -> Deactivate blocking.
        # Render's free tier has no static egress IP, so whitelisting breaks
        # again on the next redeploy.
        value: ''
      - key: SMTP_FROM
        # The account owner's own address is accepted by the free relay; a
        # different From needs validating first (Senders & Domains → Add a
        # sender → click the link in Brevo's confirmation email). If Brevo ever
        # rejects this, fall back to 'SkillSwap <bb648e001@smtp-brevo.com>',
        # which is always accepted because it is the SMTP login itself.
        value: 'SkillSwap <jimoh0004@gmail.com>'
      - key: RESEND_API_KEY
        value: ''
      - key: EMAIL_FROM
        # Resend's sandbox sender. Only usable with a verified domain — until
        # then it delivers solely to your own signup address. See docs/EMAIL.md.
        value: 'SkillSwap <onboarding@resend.dev>'
      # ── Chat media storage (video + photos) — docs/MEDIA.md ───────────────
      # Videos CANNOT live in this database: the free Render Postgres is 512 MB
      # and is deleted 90 days after creation. Supabase Storage is the no-card
      # option (1 GB stored, 5 GB/month served). The service key stays here on
      # the server — the client only ever receives a single-use signed upload URL
      # and PUTs bytes straight to storage, so large files never transit this
      # free 512 MB instance. Leave both empty and video/photo uploads answer
      # 503 MEDIA_NOT_CONFIGURED while text chat and legacy inline photos keep
      # working; the app hides the video buttons in that state.
      # Existing services may not pick up NEW keys from a Blueprint change — if
      # these do not appear after syncing, add them by hand in the dashboard.
      - key: SUPABASE_URL
        value: ''
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: ''
      - key: SUPABASE_MEDIA_BUCKET
        value: 'skillswap-media'
