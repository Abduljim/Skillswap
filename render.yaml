# SkillSwap — one-click Render Blueprint
#
# After Render deploys this Blueprint, follow the steps in docs/DEPLOY.md.

databases:
  - name: skillswap-db
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: skillswap-api
    plan: free
    region: oregon
    runtime: node
    rootDir: server
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma db push --accept-data-loss --skip-generate && npm run build:prod && node scripts/seed-prod.js
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: skillswap-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 365d
      - key: ADMIN_EMAIL
        value: jimoh0004@gmail.com
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: '*'
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 500
      - key: LOG_LEVEL
        value: info
      - key: PLAY_BILLING_VERIFY
        value: 'false'
      - key: ANDROID_PACKAGE_NAME
        value: app.skillswap.client
      - key: RESET_URL
        value: 'https://app.skillswap.app/reset-password'
      - key: SMTP_HOST
        value: ''
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        value: ''
      - key: SMTP_PASS
        value: ''
      - key: SMTP_FROM
        value: ''

  - type: static
    name: skillswap-client
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm ci --include=dev && VITE_API_URL=$VITE_API_URL npm run build
    publishDirectory: dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://skillswap-api-dcg8.onrender.com
      - key: NODE_VERSION
        value: '20'
    routes:
      - type: rewrite
        source: /<.*>
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: 'public, max-age=604800'
      - path: /*
        name: X-Frame-Options
        value: DENY
